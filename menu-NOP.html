<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

</head>

<body>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #d8faff 100%);
            background-attachment: fixed;
            /* Menjaga background tetap diam saat scroll */
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            /* Memastikan background memenuhi setidaknya seluruh tinggi layar */
            margin: 0;
        }

        .container-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: auto;
        }

        .a-content {
            text-decoration: none;
            width: 350px;
            height: 150px;
            display: flex;
            justify-content: right;
            align-items: center;
        }

        .img {
            height: 100px;
            width: 100px;
            border-radius: 30px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .judul {
            color: rgb(255, 255, 255);
            font-size: 20px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .tombol {
            display: inline-block;
            /* WAJIB: Agar padding dan shadow terbaca sempurna */
            text-decoration: none;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: rgb(0, 85, 255);
            padding: 8px 12px;
            /* Padding sedikit diperbesar agar lebih lega */
            margin: 5px 2px;
            /* Memberi jarak antar tombol agar tidak menempel */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
            /* Shadow diperhalus */
            font-size: 15px;
            /* Sesuaikan ukuran font jika perlu */
            text-align: center;
            white-space: nowrap;
            /* Mencegah teks dalam tombol turun ke bawah/patah */
        }

        .card-content {
            border: 2px solid #94f3f7;
            /* Warna garis abu-abu muda */
            border-radius: 15px;
            /* Tingkat kelengkungan sudut */
            padding: 15px;
            /* Jarak konten dari garis */
            background-color: #f8f9fa;
            /* Warna latar kotak (opsional) */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            /* Bayangan halus (opsional) */
            margin-bottom: 10px;
            /* Jarak antar kartu jika menumpuk */
        }

        .menu-judul {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .menu-tombol {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h5 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>

    <div class="container-content">
        <div class="a-content">
            <img src="kuro.jpeg" alt="maaf tidak bisa di unduh foto ini" class="img">
            <p class="judul">YongWe New Overseas Property</p>
        </div>
    </div>



    <div class="container mt-3">
        <DIV class="row">

                    <div class="menu-judul">

                    </div>
                    <p class="card-text"></p>
                    <div class="menu-tombol">
                        <a href="menu-nop-igs.html" class="tombol">CLICK HERE!</a>
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card-content">
                    <div class="menu-judul">

                    </div>
                    <p class="card-text"></p>
                    <div class="menu-tombol"><a href="menu-nop-ast.html" class="tombol">CLICK HERE!</a></div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-4">
                <div class="card-content">
                    <div class="menu-judul">
                        <h5 class="card-title">YongWe NOP Thailand</h5>
                    </div>
                    <p class="card-text"></p>
                    <div class="menu-tombol"><a href="menu-nop-tld.html" class="tombol">CLICK HERE!</a></div>
                </div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-12">
                <div class="card-content">
                    <div class="menu-judul">
                        <h5 class="card-title">YongWe NOP Malaysia</h5>
                    </div>
                    <p class="card-text"></p>
                    <div class="menu-tombol"><a href="menu-nop-mls.html" class="tombol">CLICK HERE!</a></div>
                </div>
            </div>
        </DIV>
    </div>

</body>
