<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> YongWe NOP Australia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>YongWe New Overseas Property Australia</h1>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Cari Property">

            <select id="filterDropdown">
                <option value="semua">Semua Kategori</option>
                <option value="Rumah">🏠 Rumah</option>
                <option value="Apartemen">🏢 Apartemen</option>
                <option value="Gudang">🏬 Gudang</option>
                <option value="Ruko">🏪 Ruko</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="gallery" id="gallery">
            <div class="photo-card" data-name="Apartemen">
                <img src="nop-ast.jpeg" alt="Apartemen">
                <div class="info">Apartemen</div>
                <div class="video-wrapper">
                    <iframe width="100%" height="auto" src="https://www.youtube.com/embed/fZ8sIscXzjk"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
            <div class="photo-card" data-name="Apartemen">
                <img src="nop-ast (1).jpeg" alt="Apartemen">
                <div class="info">Apartemen</div>
                <div class="video-wrapper">
                    <iframe width="100%" height="auto" src="https://www.youtube.com/embed/rLLVmoUYgdM"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
