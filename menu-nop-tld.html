<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> YongWe NOP Thailand</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>YongWe New Overseas Property Thailand</h1>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Cari Property">

            <select id="filterDropdown">
                <option value="semua">Semua Kategori</option>
                <option value="Rumah">🏠 Rumah</option>
                <option value="Apartemen">🏢 Apartemen</option>
                <option value="Gudang">🏬 Gudang</option>
                <option value="Ruko">🏪 Ruko</option>
            </select>
        </div>
    </div>

    <div class="gallery">
        <div class="container" id="gelery">

            <div class="photo-card" data-name="Apartemen">

                <div class="slider-wrapper" title="Klik untuk melihat foto selanjutnya">
                    <div class="slider-track">
                        <!-- Saya ubah ke foto 2 agar sesuai dengan daftar gambar di foldermu -->
                        <img src="nop-tld.jpeg" alt="Tampak Depan">
                    </div>
                    <div class="click-hint">Klik foto 👆</div>
                </div>

                <!-- Area Spesifikasi / Teks -->
                <div class="card-content">
                    <span class="badge-lokasi">EMBASY LIFE PATTAYA</span>
                    <h2 class="card-title">EMBASY LIFE PATTAYA</h2>

                    <div class="card-specs">
                        <p><strong>Developer: Empire Group</strong></p> <br>
                        <p>Segera Hubungi: <br>
                            YongWe Property</p>
                    </div>

                    <div class="card-price">
                        <span class="harga-promo">3,9 Juta THB<small></small></span>
                        <p class="pajak-info"></p>
                    </div>
                </div>
                <iframe width="100%" height="auto" src="https://www.youtube.com/embed/c-k8RXkRfps"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
