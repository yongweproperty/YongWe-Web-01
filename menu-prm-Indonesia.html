<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> YongWe Primary Indonesia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>Primary Indonesia</h1>
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Cari Property">

            <select id="filterDropdown">
                <option value="semua">Semua Kategori</option>
                <option value="Rumah">🏠 Rumah</option>
                <option value="Apartment">🏢 Apartment</option>
                <option value="Gudang">🏬 Gudang</option>
                <option value="Ruko">🏪 Ruko</option>
                <option value="Vila">🏞️ Vila</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div class="gallery" id="gallery">
            <div class="photo-card" data-name="Vila">
                <img src="primary-indonesia (1).jpeg" alt="Vila">
                <div class="info">Vila</div>
                <div class="video-wrapper">
                    <iframe width="100%" height="auto" src="https://www.youtube.com/embed/_GNDpYketwU"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
            <div class="photo-card" data-name="Vila">
                <img src="primary-indonesia (2).jpeg" alt="Vila">
                <div class="info">Vila</div>
                <div class="video-wrapper">
                    <iframe width="100%" height="auto" src="https://www.youtube.com/embed/Yxwua5jWUkQ"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
            <div class="photo-card" data-name="Vila">
                <img src="primary-indonesia (3).jpeg" alt="Vila">
                <div class="info">Vila</div>
                <div class="video-wrapper">
                    <iframe width="100%" height="auto" src="https://www.youtube.com/embed/9UKGysO9TbA"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
            <div class="photo-card" data-name="Gudang">
                <img src="primary-indonesia.jpeg" alt="Gudang">
                <div class="info">Gudang</div>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
